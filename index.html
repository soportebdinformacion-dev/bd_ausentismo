<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrícola Huarmey - Ausentismo 2026</title>
    <style>
        :root { --rojo: #D32F2F; --verde: #2E7D32; --gris: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding: 15px; }
        .container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 6px solid var(--rojo); }
        .logo { display: block; margin: 0 auto 10px; width: 150px; }
        h2 { color: var(--verde); text-align: center; font-size: 1.1rem; margin-bottom: 15px; }
        fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; padding: 12px; }
        legend { font-weight: bold; color: var(--rojo); padding: 0 8px; font-size: 13px; }
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input[readonly] { background: #f0f0f0; }
        .btn-search { background: var(--verde); color: white; border: none; padding: 12px; margin-top: 8px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn-submit { background: var(--rojo); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .status-bar { text-align: center; padding: 8px; margin-top: 10px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .online { background: #C8E6C9; color: #2E7D32; }
        .offline { background: #FFCDD2; color: #C62828; }
        #seccionPreguntas, #contenedorRetorno { display: none; }
    </style>
</head>
<body>

<div class="container">
    <img src="ICONO HUARMEY.png" class="logo">
    <h2>Registro de Ausentismo - Campaña 2026</h2>

    <form id="formAusentismo">
        <fieldset>
            <legend>1. INFORMACIÓN PERSONAL</legend>
            <label>Tipo de registro:</label>
            <select id="tipoRegistro" required>
                <option value="Usuario de registro">Usuario de registro</option>
                <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
                <option value="RIVALDO VALLES">RIVALDO VALLES</option>
                <option value="ALEX RUFASTO">ALEX RUFASTO</option>
                <option value="OSCAR BARREDA">OSCAR BARREDA</option>
                <option value="PILAR MONJA">PILAR MONJA</option>
            </select>

            <label>DNI:</label>
            <input type="number" id="dni" required>
            <button type="button" class="btn-search" onclick="buscarDNI()">🔍 BUSCAR TRABAJADOR</button>

            <label>Apellidos y nombres:</label>
            <input type="text" id="nombres" readonly>

            <div style="display:flex; gap:10px">
                <div style="flex:1"><label>Sexo:</label><input type="text" id="sexo" readonly></div>
                <div style="flex:1"><label>Edad:</label><input type="text" id="edad" readonly></div>
            </div>

            <label>Celular:</label>
            <input type="text" id="celular" readonly>
            <label>Fundo:</label>
            <input type="text" id="fundo" readonly>
            <label>Área:</label>
            <input type="text" id="area" readonly>
            <label>Cargo:</label>
            <input type="text" id="cargo" readonly>
            <label>Fecha de ingreso:</label>
            <input type="text" id="fechaIngreso" readonly>
            <label>TIPO:</label>
            <input type="text" id="tipoTrabajador" readonly>
        </fieldset>

        <fieldset>
            <legend>2. LLAMADAS DE ENCUESTA</legend>
            <label>¿Se logró contactar?:</label>
            <select id="contacto" required onchange="toggleSeccionPreguntas()">
                <option value="">Seleccione...</option>
                <option value="SI">SI</option>
                <option value="NO">NO</option>
                <option value="NUMERO APAGADO">NUMERO APAGADO</option>
                <option value="NO RESPONDE">NO RESPONDE</option>
            </select>

            <div id="seccionPreguntas">
                <label>Fecha de llamada:</label>
                <input type="date" id="fechaLlamada">
                <label>Motivo de ausencia:</label>
                <select id="motivo">
                    <option value="Ninguno">Ninguno</option>
                    <option value="Enfermedad">Enfermedad</option>
                    <option value="Problemas familiares">Problemas familiares</option>
                    <option value="Viaje">Viaje</option>
                </select>

                <label>¿Vas a regresar?:</label>
                <select id="regresa" onchange="toggleFechaRetorno()">
                    <option value="">Seleccione...</option>
                    <option value="SI">SI</option>
                    <option value="NO">NO</option>
                </select>

                <div id="contenedorRetorno">
                    <label>Fecha de retorno:</label>
                    <input type="date" id="fechaRetornoInput">
                </div>

                <label>Mejoras de la empresa:</label>
                <textarea id="mejora" rows="2"></textarea>
            </div>

            <label>Observaciones:</label>
            <textarea id="observaciones" rows="2"></textarea>
        </fieldset>

        <button type="submit" class="btn-submit">GUARDAR Y ENVIAR</button>
    </form>

    <div id="networkStatus" class="status-bar online">● Sistema en Línea</div>
</div>

<script src="https://unpkg.com/dexie@3.2.0/dist/dexie.min.js"></script>
<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyP7wCWo8NAy3sAzKFKKghYlU8L3YoL2FZ_mOAPnihyl0wqp9mgt_2Kw-sXrXjpWEZpKQ/exec'; 

    const db = new Dexie('BD_AUSENTISMO_V2');
    db.version(1).stores({
        personal: 'DNI',
        registros: '++id, synchronized'
    });

    function toggleSeccionPreguntas() {
        const contacto = document.getElementById('contacto').value;
        document.getElementById('seccionPreguntas').style.display = (contacto === "SI") ? "block" : "none";
    }

    function toggleFechaRetorno() {
        const regresa = document.getElementById('regresa').value;
        document.getElementById('contenedorRetorno').style.display = (regresa === "SI") ? "block" : "none";
    }

    // BUSCAR DNI CORREGIDO - MAPEO DIRECTO A EXCEL
async function buscarDNI() {
    const dniInput = document.getElementById('dni').value.toString().trim();
    if (!dniInput) return alert("Por favor, ingrese un DNI.");

    // Buscamos en la base de datos local (Dexie)
    const persona = await db.personal.get(dniInput);

    if (persona) {
        // Usamos exactamente los nombres de las columnas de tu Excel[cite: 2]
        document.getElementById('nombres').value = persona["APELLIDOS Y NOMBRES"] || '';
        document.getElementById('sexo').value = persona["SEXO"] || '';
        document.getElementById('edad').value = persona["EDAD"] || '';
        document.getElementById('celular').value = persona["CELULAR"] || '';
        document.getElementById('fundo').value = persona["FUNDO"] || '';
        document.getElementById('area').value = persona["AREA"] || '';
        document.getElementById('cargo').value = persona["CARGO"] || '';
        document.getElementById('fechaIngreso').value = persona["FECHA INGRESO"] || '';
        document.getElementById('tipoTrabajador').value = persona["TIPO"] || '';
        console.log("Datos cargados correctamente");
    } else {
        alert("DNI no encontrado. Asegúrese de haber sincronizado el padrón con internet.");
    }
}

    async function actualizarPadron() {
        if (!navigator.onLine) return;
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (data && data.length > 0) {
                await db.personal.clear();
                // Aseguramos que el DNI sea string para la búsqueda[cite: 2]
                const dataMapeada = data.map(p => ({ ...p, DNI: String(p.DNI).trim() }));
                await db.personal.bulkPut(dataMapeada);
                console.log("Padrón cargado:", dataMapeada.length);
            }
        } catch (e) { console.error("Error descarga:", e); }
    }

    document.getElementById('formAusentismo').onsubmit = async (e) => {
        e.preventDefault();
        const reg = {
            tipoRegistro: document.getElementById('tipoRegistro').value,
            dni: document.getElementById('dni').value,
            nombres: document.getElementById('nombres').value,
            sexo: document.getElementById('sexo').value,
            edad: document.getElementById('edad').value,
            celular: document.getElementById('celular').value,
            fundo: document.getElementById('fundo').value,
            area: document.getElementById('area').value,
            cargo: document.getElementById('cargo').value,
            fIngreso: document.getElementById('fechaIngreso').value,
            tipoT: document.getElementById('tipoTrabajador').value,
            contacto: document.getElementById('contacto').value,
            fLlamada: document.getElementById('fechaLlamada').value,
            motivo: document.getElementById('motivo').value,
            regresa: document.getElementById('regresa').value,
            fRetorno: document.getElementById('fechaRetornoInput').value,
            mejora: document.getElementById('mejora').value,
            obs: document.getElementById('observaciones').value,
            synchronized: 0
        };
        await db.registros.add(reg);
        alert("Registro guardado localmente.");
        document.getElementById('formAusentismo').reset();
        intentarSincronizar();
    };

   // SINCRONIZACIÓN DE SALIDA CORREGIDA (19 CAMPOS)[cite: 2]
async function intentarSincronizar() {
    if(!navigator.onLine) return;
    const pends = await db.registros.where('synchronized').equals(0).toArray();
    
    for(let r of pends) {
        const f = new URLSearchParams();
        
        // Mapeamos los datos para que coincidan con el doPost del script[cite: 2]
        f.append("TIPO REGISTRO", r.tipoRegistro);
        f.append("DNI", r.dni);
        f.append("APELLIDOS Y NOMBRES", r.nombres);
        f.append("SEXO", r.sexo || document.getElementById('sexo').value);
        f.append("EDAD", r.edad || document.getElementById('edad').value);
        f.append("CELULAR", r.celular || document.getElementById('celular').value);
        f.append("FUNDO", r.fundo || document.getElementById('fundo').value);
        f.append("AREA", r.area || document.getElementById('area').value);
        f.append("CARGO", r.cargo || document.getElementById('cargo').value);
        f.append("FECHA INGRESO", r.fIngreso || document.getElementById('fechaIngreso').value);
        f.append("TIPO", r.tipoT || document.getElementById('tipoTrabajador').value);
        f.append("STATUS LLAMADA", r.contacto);
        f.append("REGISTRO LLAMADA", r.fLlamada);
        f.append("MOTIVO AUSENCIA", r.motivo);
        f.append("VAS A REGRESAR", r.regresa);
        f.append("FECHA RETORNO", r.fRetorno);
        f.append("COMENTARIOS MEJORA", r.mejora);
        f.append("OBSERVACIONES", r.obs);

        try {
            // Usamos 'no-cors' para evitar bloqueos de navegador en el envío[cite: 2]
            await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: f });
            await db.registros.update(r.id, { synchronized: 1 });
        } catch(e) { 
            console.error("Error al sincronizar:", e); 
        }
    }
}

    window.addEventListener('online', () => {
        document.getElementById('networkStatus').className = "status-bar online";
        actualizarPadron(); intentarSincronizar();
    });

    actualizarPadron();
</script>
</body>
</html>
